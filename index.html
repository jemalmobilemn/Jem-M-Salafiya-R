<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jem Salafiya AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Header -->
        <header class="app-header">
            <div class="logo-area">
                <i class="fa-solid fa-robot"></i>
                <h1>Jem Salafiya AI</h1>
            </div>
            <div class="actions">
                <button id="theme-toggle" title="Mode ቀይር"><i class="fa-solid fa-moon"></i></button>
            </div>
        </header>

        <!-- Chat Box Area -->
        <main class="chat-main">
            <div id="chat-history" class="chat-history">
                <div class="message ai-message">
                    ሰላም! እንቁ አብዱር ነኝ። ዛሬ ምን እንወያይ? ወይም ምን አልረዳዎ?
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-footer">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="መልዕክትዎትን እዚህ ይጻፉ..." autocomplete="off" required>
                <button type="submit" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
