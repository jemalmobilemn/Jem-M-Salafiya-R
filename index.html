<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jem Salafiya AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <i class="fa-solid fa-kaaba"></i>
                <h1>Jem Salafiya AI</h1>
            </div>
        </header>

        <main class="chat-main">
            <div id="chat-history" class="chat-history">
                <div class="message ai-message">
                    አሰላሙ አለይኩም ወራህመቱላሂ ወበረካቱህ! <br>
                    እኔ የ **Jem Salafiya AI** ረዳት ነኝ። በቁርአን ተፍሲር፣ በሐዲስ እና በእስልምና ህግጋት ዙሪያ በአማርኛ፣ በአፋን ኦሮሞ፣ በእንግሊዝኛ እና በአረብኛ መጠየቅ ይችላሉ።
                </div>
            </div>
        </main>

        <footer class="chat-footer">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="ስለ ተፍሲር ወይም እስልምና ጥያቄ ይጻፉ..." autocomplete="off" required>
                <button type="submit" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
