
<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="Jem Salafiya AI Islamic learning assistant">
  <title>Jem Salafiya AI</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-icon">☪</div>
      <div class="brand-text">
        <h1>Jem Salafiya AI</h1>
        <p id="subtitle">የእስልምና ትምህርት ረዳት</p>
      </div>
      <select id="language" aria-label="Choose language">
        <option value="am">አማርኛ</option>
        <option value="om">Afaan Oromo</option>
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>
    </header>

    <section class="welcome">
      <div class="bismillah">﷽</div>
      <h2 id="welcomeTitle">አሰላሙ ዐለይኩም!</h2>
      <p id="welcomeText">ስለ ቁርአን፣ ተፍሲር፣ ሐዲስ እና እስላማዊ ትምህርት ይጠይቁ።</p>
    </section>

    <section class="suggestions">
      <button type="button" class="suggestion" data-question="ሱረቱል ፋቲሓን በአማርኛ ከተፍሲር ጋር አስረዳኝ።">📖 የቁርአን ተፍሲር</button>
      <button type="button" class="suggestion" data-question="የዕለት ተዕለት ዚክርና ዱዓ ከማስረጃ ጋር አስረዳኝ።">🤲 ዚክርና ዱዓ</button>
      <button type="button" class="suggestion" data-question="ስለ አንድ ሐዲስ ምንጩንና ደረጃውን ጨምረህ አስረዳኝ።">📚 ሐዲስ</button>
    </section>

    <section id="chat" class="chat" aria-live="polite">
      <div class="message assistant">
        <div class="avatar">☪</div>
        <div class="bubble">
          <strong>Jem Salafiya AI</strong>
          <p id="firstMessage">እንኳን ደህና መጡ። ጥያቄዎን ከታች ይጻፉ።</p>
        </div>
      </div>
    </section>

    <div id="status" class="status" role="status"></div>

    <form id="chatForm" class="composer">
      <textarea id="messageInput" rows="1" maxlength="6000"
        placeholder="ጥያቄዎን እዚህ ይጻፉ..."
        aria-label="Write your question" required></textarea>
      <button id="sendButton" type="submit" aria-label="Send message">➤</button>
    </form>

    <footer class="footer">
      <p id="footerText">የAI መልሶችን ከታማኝ የእስልምና ምንጮች ጋር ያረጋግጡ።</p>
      <button id="clearButton" type="button" class="clear-button">ውይይቱን አጽዳ</button>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
